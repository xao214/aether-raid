<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#05060d" />
  <title>Aether Raid</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="wrap">
    <div id="stage">
      <canvas id="game" width="420" height="640"></canvas>
      <div id="hud">
        <div id="scoreHud">SCORE 0</div>
        <div id="livesHud">▲▲▲</div>
        <div id="hiHud">HI 0</div>
      </div>
      <div id="touch" aria-hidden="true">
        <div id="stick"><div id="knob"></div></div>
        <button type="button" id="fireBtn">FIRE</button>
        <button type="button" id="pauseBtn">II</button>
        <button type="button" id="muteBtn">♪</button>
      </div>
    </div>
    <div id="hint">Phone: left stick · hold FIRE · or WASD / space on a keyboard</div>
  </div>
  <script src="js/audio.js"></script>
  <script src="js/game.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
